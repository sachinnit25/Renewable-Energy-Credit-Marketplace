name: CI / CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust & WASM Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Frontend Unit Tests
        run: npm test

      - name: Run Soroban Contract Unit Tests
        run: |
          cd contracts/soroban_rec
          cargo test

      - name: Build Frontend Production Artifacts
        run: npm run build

      - name: Deploy Smart Contract (Stellar Testnet)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: npm run deploy:contract

  deploy-frontend:
    name: Deploy Frontend
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Node Dependencies
        run: npm ci
      - name: Build Frontend
        run: npm run build
      - name: Deploy to Vercel (Dry Run / Production Deployment)
        run: npx vercel --token ${{ secrets.VERCEL_TOKEN }} --prod --yes || echo "Vercel token not configured, skipping remote deployment"


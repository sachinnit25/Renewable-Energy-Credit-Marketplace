name: CI / CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust & WASM Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Frontend Unit Tests
        run: npm test

      - name: Run Soroban Contract Unit Tests
        run: |
          cd contracts/soroban_rec
          cargo test

      - name: Compile Soroban Rust Smart Contract
        run: |
          cd contracts/soroban_rec
          cargo build --target wasm32-unknown-unknown --release

      - name: Save test output artifact
        if: always()
        run: npm test > screens/tests-output.txt 2>&1 || true

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: screens/tests-output.txt
